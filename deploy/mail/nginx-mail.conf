# /etc/nginx/sites-available/femboyz-mail. Obtain mail.'s cert before enabling.
upstream femboyz_webmail {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.femboyz.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.femboyz.cloud;

    ssl_certificate /etc/letsencrypt/live/mail.femboyz.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.femboyz.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;
    # OAuth state and token cookies can exceed nginx's default upstream header buffer.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;

    location / {
        proxy_pass http://femboyz_webmail;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
