# Stalwart and Bulwark webmail for femboyz.cloud.
#
# Installed copy: /etc/femboyz-mail/docker-compose.yml (root:root, 600).
# Driven from the ops user with sudo, like MongoDB. See DEPLOYMENT.md section 13.
#
# Upgrades are manual: Stalwart uses `pull` + `up -d`; rebuild webmail with
# deploy/mail/bulwark/build.sh before `up -d webmail`.
# GitHub Actions deploy.sh never touches this stack.

name: femboyz-mail

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: femboyz-stalwart
    restart: unless-stopped
    hostname: mx.femboyz.cloud
    environment:
      # Base URL published in OAuth/OIDC/JMAP discovery. nginx serves it.
      STALWART_PUBLIC_URL: https://mx.femboyz.cloud
      # Pre-fills the server hostname in the setup wizard.
      STALWART_HOSTNAME: mx.femboyz.cloud
    env_file:
      # Holds STALWART_RECOVERY_ADMIN only while it is needed (bootstrap,
      # recovery). Keep the file, empty, the rest of the time.
      - path: /etc/femboyz-mail/stalwart.env
        required: false
    ports:
      # Inbound SMTP from the internet. Docker DNAT keeps the real client IP,
      # which SPF/DMARC and auto-ban need. Docker-published ports bypass UFW.
      - "25:25"
      # HTTPS (JMAP, WebUI, OAuth) for nginx only. Never publish it publicly.
      - "127.0.0.1:8443:443"
      # SMTP submission (implicit TLS) for Fastify's mailer as noreply@, loopback only.
      # Mail apps (465/993 public) come in a later phase.
      - "127.0.0.1:465:465"
    volumes:
      - stalwart_etc:/etc/stalwart
      - stalwart_data:/var/lib/stalwart
      # Copy of the certbot mx.femboyz.cloud cert, owned by UID 2000.
      # Kept in sync by the certbot deploy hook.
      - /etc/femboyz-mail/tls:/etc/stalwart-tls:ro
      # Secret key of the S3 blob store (mail bodies, DEPLOYMENT.md 16.5), UID 2000, mode 400.
      - /etc/femboyz-mail/s3-blobs-secret:/run/secrets/stalwart_s3_blobs:ro
    # Host unbound on the bridge gateway, not Hetzner's shared resolvers,
    # which DNS blocklists refuse. See unbound-femboyz-mail.conf.
    dns:
      - 172.30.25.1
    networks:
      mail:
        # Fixed address so the bootstrap/recovery listener (:8080) can be
        # reached from the host without publishing it: http://172.30.25.10:8080
        ipv4_address: 172.30.25.10
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  webmail:
    # Rebuilt from the exact upstream commit plus deploy/mail/bulwark/auto-sso.patch.
    image: femboyz/bulwark:1.15.0-femboyz.5
    pull_policy: never
    container_name: femboyz-webmail
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    env_file:
      - /etc/femboyz-mail/webmail/bulwark.env
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - /etc/femboyz-mail/webmail/admin:/app/data/admin:ro
      - /etc/femboyz-mail/webmail/state:/app/data/admin-state
      - /etc/femboyz-mail/webmail/settings:/app/data/settings
      - /etc/femboyz-mail/webmail/branding:/app/public/branding/femboyz:ro
      - /etc/femboyz-mail/webmail/secrets/oauth:/run/secrets/bulwark_oauth:ro
      - /etc/femboyz-mail/webmail/secrets/session:/run/secrets/bulwark_session:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mail
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  mail:
    driver_opts:
      # Fixed name so UFW can allow DNS from this bridge only.
      com.docker.network.bridge.name: br-fbzmail
    ipam:
      config:
        - subnet: 172.30.25.0/24
          gateway: 172.30.25.1

volumes:
  stalwart_etc:
  stalwart_data:
