# mx.femboyz.cloud: Stalwart's HTTPS side (JMAP, OAuth, WebUI). Machines only.
#
# Installed copy: /etc/nginx/sites-available/femboyz-mx
# The certificate comes from `certbot certonly --nginx -d mx.femboyz.cloud`
# (see DEPLOYMENT.md section 13), so certbot never edits this file.

map $http_upgrade $femboyz_mx_connection {
    default upgrade;
    ""      "";
}

# Browser JMAP access is limited to our webmail origin. No credential cookies.
map $http_origin $femboyz_jmap_origin {
    default "";
    "https://mail.femboyz.cloud" "https://mail.femboyz.cloud";
}

upstream femboyz_stalwart {
    server 127.0.0.1:8443;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mx.femboyz.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mx.femboyz.cloud;

    ssl_certificate /etc/letsencrypt/live/mx.femboyz.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mx.femboyz.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # JMAP blob uploads (attachments). Stalwart enforces its own limit.
    client_max_body_size 64m;

    # Include discovery redirects and errors; browsers check CORS on both.
    add_header Access-Control-Allow-Origin $femboyz_jmap_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Last-Event-ID, Cache-Control" always;
    add_header Access-Control-Expose-Headers "Location, Content-Disposition" always;
    add_header Vary "Origin" always;

    location / {
        if ($request_method = OPTIONS) { return 204; }
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        # Re-encrypt to Stalwart's HTTPS listener and check its certificate,
        # which is the same Let's Encrypt cert nginx serves.
        proxy_pass https://femboyz_stalwart;
        proxy_ssl_server_name on;
        proxy_ssl_name mx.femboyz.cloud;
        proxy_ssl_verify on;
        # leaf -> Let's Encrypt intermediate -> root; nginx defaults to 1
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_session_reuse on;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Stalwart (Http.useXForwarded) takes the client IP from `Forwarded`
        # first, then the FIRST X-Forwarded-For entry. Overwrite both so a
        # client can't spoof its IP to dodge or redirect auto-bans.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # JMAP WebSocket and EventSource push
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $femboyz_mx_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
