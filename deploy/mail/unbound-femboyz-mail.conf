# Local recursive DNS resolver for Stalwart.
#
# Installed copy: /etc/unbound/unbound.conf.d/femboyz-mail.conf
#
# DNS blocklists (Spamhaus, DNSWL, SenderScore, ...) refuse queries that
# arrive through shared resolvers such as Hetzner's 185.12.64.x, which turns
# those spam checks off (`*_BLOCKED_OPENRESOLVER` tags). Stalwart therefore
# resolves through this unbound, reached at the mail bridge gateway.
server:
    interface: 127.0.0.1
    interface: 172.30.25.1
    # The bridge address exists only once Docker has created the network.
    ip-freebind: yes

    access-control: 127.0.0.0/8 allow
    access-control: 172.30.25.0/24 allow

    # The VPS has no IPv6 connectivity.
    do-ip6: no
    prefer-ip6: no

    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    prefetch: yes
